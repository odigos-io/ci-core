name: Require Linked Linear Issue
description: Ensures pull requests reference a Linear issue in the PR title, which is what reaches the default branch

# Every odigos repo squashes with squash_merge_commit_title=PR_TITLE, so the PR title
# becomes the commit subject on the default branch — where the Linear release scan
# reads it. The body and the branch name reach nothing, so a key in either alone is
# lost. check.js owns the skip rules and the decision.

inputs:
  enforce:
    description: >
      Fail when the PR title carries no Linear key. "false" downgrades it to a
      warning while a repo is being cleaned up.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Ensure PR links a Linear issue
      shell: bash
      env:
        ENFORCE: ${{ inputs.enforce }}
      run: node "${{ github.action_path }}/check.js"
