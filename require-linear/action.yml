name: Require Linked Linear Issue
description: Ensures pull requests reference a Linear issue that survives the merge into the default branch

# Most of the org squashes with COMMIT_OR_PR_TITLE, which takes the commit title on a
# single-commit PR — so a key living only in the PR title never reaches main, where the
# release scan reads it. check.js predicts the subject the merge will produce and checks
# that; it also owns the skip rules and the GitHub lookups.

inputs:
  enforce-commit-subject:
    description: >
      Fail when the key would not survive the merge. "false" downgrades it to a
      warning while a repo is being cleaned up.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Ensure PR links a Linear issue
      shell: bash
      env:
        ENFORCE: ${{ inputs.enforce-commit-subject }}
        GITHUB_TOKEN: ${{ github.token }}
      run: node "${{ github.action_path }}/check.js"
