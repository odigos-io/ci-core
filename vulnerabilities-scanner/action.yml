name: "Vulnerability Scanner (Grype)"
description: "Scan container images or filesystem paths for vulnerabilities using Grype"

inputs:
  image:
    description: "The container image to scan, use complete image reference (e.g., 'nginx:latest' or 'myregistry.com/myimage:tag')"
    required: false
  path:
    description: "Path to the file system to scan (e.g., a directory containing source code or extracted image layers)"
    required: false
  images:
    description: "Container images to scan in one run, one '<name>=<image>' per line. Each image's results are written to <results-dir>/<name>.json."
    required: false
  severity-cutoff:
    description: "Comma-separated list of severity levels that will cause the workflow to fail (e.g., 'HIGH,CRITICAL' or 'CRITICAL'). Leave empty to never fail."
    required: false
    default: "HIGH,CRITICAL"
  verbosity:
    description: "Verbosity level for the summary (basic or detailed)"
    required: false
    default: "basic"

outputs:
  results-file:
    description: "Path to the raw Grype JSON results file. Always written, at any size."
    value: ${{ steps.process-results.outputs.results-file }}
  results-dir:
    description: "With 'images': the directory holding each scanned image's <name>.json."
    value: ${{ steps.process-results.outputs.results-dir }}
  total-count:
    description: "Total number of matches found, across all images with 'images'"
    value: ${{ steps.process-results.outputs.total-count }}
  critical-count:
    description: "Number of CRITICAL severity matches"
    value: ${{ steps.process-results.outputs.critical-count }}
  high-count:
    description: "Number of HIGH severity matches"
    value: ${{ steps.process-results.outputs.high-count }}
  cutoff-exceeded:
    description: "'true' when findings at or above severity-cutoff were present. Set even when the step is wrapped in continue-on-error."
    value: ${{ steps.process-results.outputs.cutoff-exceeded }}

runs:
  using: composite
  steps:
    - name: Validate Inputs
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        SCAN_PATH: ${{ inputs.path }}
        IMAGES: ${{ inputs.images }}
      run: |
        provided=0
        for input in "$IMAGE" "$SCAN_PATH" "$IMAGES"; do
          [ -n "$input" ] && provided=$((provided + 1))
        done
        if [ "$provided" -ne 1 ]; then
          echo "Error: You must provide exactly one of the 'image', 'path' or 'images' inputs."
          exit 1
        fi

    - name: Allocate results file
      shell: bash
      run: |
        # A unique file per invocation: callers routinely run several scans in one
        # job, and a fixed filename would have each scan overwrite the last.
        echo "GRYPE_RESULTS_FILE=$(mktemp "${RUNNER_TEMP:-/tmp}/grype-results-XXXXXXXX.json")" >> "$GITHUB_ENV"
        echo "GRYPE_RESULTS_DIR=$(mktemp -d "${RUNNER_TEMP:-/tmp}/grype-results-XXXXXXXX")" >> "$GITHUB_ENV"

    - name: Install Grype
      shell: bash
      env:
        GRYPE_VERSION: "0.110.0"
      run: |
        # GitHub's release CDN answers 5xx now and then; without retries the scan step dies,
        # the summary step then emits an empty report, and consumers would score the image clean.
        curl -sSfL --retry 5 --retry-delay 5 --retry-all-errors "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz" -o "grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
        curl -sSfL --retry 5 --retry-delay 5 --retry-all-errors "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_checksums.txt" -o grype_checksums.txt
        grep "grype_${GRYPE_VERSION}_linux_amd64.tar.gz" grype_checksums.txt | sha256sum -c -
        tar xzf "grype_${GRYPE_VERSION}_linux_amd64.tar.gz" grype
        sudo mv grype /usr/local/bin/grype
        rm "grype_${GRYPE_VERSION}_linux_amd64.tar.gz" grype_checksums.txt

    - name: Scan Image for Vulnerabilities
      if: ${{ inputs.image != '' && inputs.path == '' }}
      shell: bash
      run: |
        grype ${{ inputs.image }} \
          -o json \
          --only-fixed \
          --file "$GRYPE_RESULTS_FILE"

    - name: Scan Path for Vulnerabilities
      if: ${{ inputs.path != '' && inputs.image == '' }}
      shell: bash
      run: |
        grype dir:${{ inputs.path }} \
          -o json \
          --only-fixed \
          --file "$GRYPE_RESULTS_FILE"

    # Scans every image even when one fails, so the others still report, then fails the step.
    # Grype downloads its vulnerability database on the first scan and reuses it for the rest.
    - name: Scan Images for Vulnerabilities
      if: ${{ inputs.images != '' }}
      shell: bash
      env:
        IMAGES: ${{ inputs.images }}
      run: |
        set -uo pipefail
        failed=()
        while IFS='=' read -r name image; do
          [ -n "$name" ] || continue
          echo "::group::Scan $name ($image)"
          if ! grype "$image" -o json --only-fixed --file "$GRYPE_RESULTS_DIR/$name.json"; then
            failed+=("$name")
            rm -f "$GRYPE_RESULTS_DIR/$name.json"
          fi
          echo "::endgroup::"
        done <<< "$IMAGES"
        if [ ${#failed[@]} -gt 0 ]; then
          echo "::error::Could not scan: ${failed[*]}"
          exit 1
        fi

    - name: Display in Summary
      if: always()
      id: process-results
      shell: bash
      env:
        IMAGES: ${{ inputs.images }}
        SEVERITY_CUTOFF_INPUT: ${{ inputs.severity-cutoff }}
        VERBOSITY: ${{ inputs.verbosity }}
      run: |
        set -euo pipefail

        echo "## 🔍 Vulnerability Scan Results" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"

        # This step is if: always(), so it can run even when input validation bailed
        # out before a results file was ever allocated.
        RESULTS_FILE="${GRYPE_RESULTS_FILE:-${RUNNER_TEMP:-/tmp}/grype-results-unallocated.json}"
        echo "results-file=$RESULTS_FILE" >> "$GITHUB_OUTPUT"
        echo "results-dir=${GRYPE_RESULTS_DIR:-}" >> "$GITHUB_OUTPUT"

        SEVERITY_CUTOFF="$(echo "$SEVERITY_CUTOFF_INPUT" | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]')"
        VERBOSITY_NORMALIZED="$(echo "${VERBOSITY:-basic}" | tr '[:upper:]' '[:lower:]')"

        write_vulnerability_basic() {
          local match="$1"
          local vuln_id artifact_name artifact_version fixed_versions

          vuln_id="$(echo "$match" | jq -r '.vulnerability.id // "UNKNOWN"')"
          artifact_name="$(echo "$match" | jq -r '.artifact.name // "unknown-artifact"')"
          artifact_version="$(echo "$match" | jq -r '.artifact.version // "unknown-version"')"
          fixed_versions="$(echo "$match" | jq -r '.vulnerability.fix.versions // [] | if length > 0 then join(", ") else "N/A" end')"

          echo "- **${vuln_id}** in \`${artifact_name}@${artifact_version}\` (Fixed: ${fixed_versions})" >> "$GITHUB_STEP_SUMMARY"
        }

        write_vulnerability_detailed() {
          local match="$1"
          local vuln_id artifact_name artifact_version fixed_versions
          local wrote_path=false

          vuln_id="$(echo "$match" | jq -r '.vulnerability.id // "UNKNOWN"')"
          artifact_name="$(echo "$match" | jq -r '.artifact.name // "unknown-artifact"')"
          artifact_version="$(echo "$match" | jq -r '.artifact.version // "unknown-version"')"
          fixed_versions="$(echo "$match" | jq -r '.vulnerability.fix.versions // [] | if length > 0 then join(", ") else "N/A" end')"

          echo "- **${vuln_id}**" >> "$GITHUB_STEP_SUMMARY"
          echo "  - Artifact: \`${artifact_name}@${artifact_version}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "  - Fixed Versions: ${fixed_versions}" >> "$GITHUB_STEP_SUMMARY"
          echo "  - Detection Paths:" >> "$GITHUB_STEP_SUMMARY"

          while IFS= read -r primary_path; do
            if [ -n "$primary_path" ]; then
              echo "    - (primary) \`${primary_path}\`" >> "$GITHUB_STEP_SUMMARY"
              wrote_path=true
            fi
          done < <(echo "$match" | jq -r '.artifact.locations // [] | .[] | select(.annotations.evidence == "primary") | (.path // .accessPath // empty)')

          while IFS= read -r supporting_path; do
            if [ -n "$supporting_path" ]; then
              echo "    - (supporting) \`${supporting_path}\`" >> "$GITHUB_STEP_SUMMARY"
              wrote_path=true
            fi
          done < <(echo "$match" | jq -r '.artifact.locations // [] | .[] | select(.annotations.evidence == "supporting") | (.path // .accessPath // empty)')

          if [ "$wrote_path" = false ]; then
            echo "    - N/A" >> "$GITHUB_STEP_SUMMARY"
          fi
        }

        write_section() {
          local severity="$1"
          local title="$2"
          local count="$3"
          local collapsible="$4"

          if [ "$count" -le 0 ]; then
            return 0
          fi

          if [ "$collapsible" = "true" ]; then
            echo "<details><summary>${title} (${count})</summary>" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ${title} (${count})" >> "$GITHUB_STEP_SUMMARY"
          fi

          while IFS= read -r match; do
            if [ "$VERBOSITY_NORMALIZED" = "detailed" ]; then
              write_vulnerability_detailed "$match"
            else
              write_vulnerability_basic "$match"
            fi
            echo "" >> "$GITHUB_STEP_SUMMARY"
          done < <(jq -c --arg severity "$severity" '.matches // [] | .[] | select((.vulnerability.severity // "" | ascii_downcase) == ($severity | ascii_downcase))' "$JSON_FILE")

          if [ "$collapsible" = "true" ]; then
            echo "</details>" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
        }

        TOTAL=0 CRITICAL=0 HIGH=0 MEDIUM=0 LOW=0 NEGLIGIBLE=0 UNKNOWN=0

        count_severity() {
          jq --arg severity "$1" '[.matches // [] | .[] | select((.vulnerability.severity // "" | ascii_downcase) == $severity)] | length' "$JSON_FILE"
        }

        # Writes the summary of one results file and adds its counts to the totals.
        report() {
          JSON_FILE="$1"

          # No file means grype never produced a report. Emit an empty-but-valid
          # document so downstream consumers always have well-formed JSON to read.
          if [ ! -s "$JSON_FILE" ]; then
            echo '{"matches":[]}' > "$JSON_FILE"
            echo "✅ No vulnerabilities found!" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            return 0
          fi

          local total critical high medium low negligible unknown
          total="$(jq '[.matches // [] | .[]] | length' "$JSON_FILE")"
          critical="$(count_severity critical)"
          high="$(count_severity high)"
          medium="$(count_severity medium)"
          low="$(count_severity low)"
          negligible="$(count_severity negligible)"
          unknown="$(count_severity unknown)"

          echo "| Severity | Count |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🔴 Critical | $critical |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🟠 High | $high |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🟡 Medium | $medium |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🔵 Low | $low |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ⚪ Negligible | $negligible |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ❔ Unknown | $unknown |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Total** | **$total** |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          write_section "critical" "🔴 Critical Vulnerabilities" "$critical" "false"
          write_section "high" "🟠 High Vulnerabilities" "$high" "false"
          write_section "medium" "🟡 Medium Vulnerabilities" "$medium" "true"
          write_section "low" "🔵 Low Vulnerabilities" "$low" "true"
          write_section "negligible" "⚪ Negligible Vulnerabilities" "$negligible" "true"
          write_section "unknown" "❔ Unknown Vulnerabilities" "$unknown" "true"

          TOTAL=$((TOTAL + total)) CRITICAL=$((CRITICAL + critical)) HIGH=$((HIGH + high))
          MEDIUM=$((MEDIUM + medium)) LOW=$((LOW + low)) NEGLIGIBLE=$((NEGLIGIBLE + negligible))
          UNKNOWN=$((UNKNOWN + unknown))
        }

        if [ -n "$IMAGES" ]; then
          # An image the scan step could not scan has no results file, and the scan step already failed for it.
          for json_file in "${GRYPE_RESULTS_DIR:-/nonexistent}"/*.json; do
            [ -e "$json_file" ] || continue
            echo "## 📦 $(basename "$json_file" .json)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            report "$json_file"
          done
        else
          report "$RESULTS_FILE"
        fi

        {
          echo "total-count=$TOTAL"
          echo "critical-count=$CRITICAL"
          echo "high-count=$HIGH"
        } >> "$GITHUB_OUTPUT"

        SHOULD_FAIL=false
        if [ -n "$SEVERITY_CUTOFF" ]; then
          if [[ "$SEVERITY_CUTOFF" == *"CRITICAL"* ]] && [ "$CRITICAL" -gt 0 ]; then
            SHOULD_FAIL=true
          fi
          if [[ "$SEVERITY_CUTOFF" == *"HIGH"* ]] && [ "$HIGH" -gt 0 ]; then
            SHOULD_FAIL=true
          fi
          if [[ "$SEVERITY_CUTOFF" == *"MEDIUM"* ]] && [ "$MEDIUM" -gt 0 ]; then
            SHOULD_FAIL=true
          fi
          if [[ "$SEVERITY_CUTOFF" == *"LOW"* ]] && [ "$LOW" -gt 0 ]; then
            SHOULD_FAIL=true
          fi
          if [[ "$SEVERITY_CUTOFF" == *"NEGLIGIBLE"* ]] && [ "$NEGLIGIBLE" -gt 0 ]; then
            SHOULD_FAIL=true
          fi
          if [[ "$SEVERITY_CUTOFF" == *"UNKNOWN"* ]] && [ "$UNKNOWN" -gt 0 ]; then
            SHOULD_FAIL=true
          fi
        fi

        # Recorded as an output as well as an exit code: callers commonly wrap this
        # action in continue-on-error, which rewrites the step conclusion to success
        # and would otherwise leave no trace that the cutoff was breached.
        echo "cutoff-exceeded=$SHOULD_FAIL" >> "$GITHUB_OUTPUT"

        if [ "$SHOULD_FAIL" = true ]; then
          exit 1
        fi
