name: "Apply Agent Version Update"
description: |
  Shared consumer-side logic for an instrumentation-agent version bump: run the
  repo's `upgrade-agent` make target, then (if anything changed) open an
  auto-merging PR and notify Slack.
inputs:
  instrumentation_agent:
    description: "Language instrumentation to update (e.g. php, java-ebpf, golang, cpp)"
    required: true
  version:
    description: "Version to set (e.g. v0.11.0)"
    required: true
  make_dir:
    description: "Directory containing the repo's agent-deps.mk to run `make` in (e.g. odiglet, or . for repo root)"
    required: false
    default: "."
  webhook-url:
    description: "Slack webhook URL for the release status notification"
    required: true
  automerge:
    description: "Enable auto-merge on the created PR"
    required: false
    default: "true"
  ecr-login:
    description: "Log in to public ECR before running make, so digest lookups get the authenticated rate limit. Login failure falls back to anonymous pulls with a warning."
    required: false
    default: "true"
  ecr-role-to-assume:
    description: "IAM role assumed over OIDC for the public ECR login (the calling job needs `id-token: write`)"
    required: false
    default: "arn:aws:iam::061717858829:role/ecr-pull-push-role"

runs:
  using: composite
  steps:
    # Anonymous pulls from shared runner IPs hit public ECR's rate and data limits (429), so log in
    # first. The credentials stay in step outputs (not job env) and are only handed to `docker login`;
    # the registry login itself is removed again right after the update.
    - name: Configure AWS credentials for public ECR
      id: aws
      if: ${{ inputs.ecr-login == 'true' }}
      continue-on-error: true
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.ecr-role-to-assume }}
        aws-region: us-east-1
        role-duration-seconds: 900
        output-credentials: true
        output-env-credentials: false
        retry-max-attempts: 2

    - name: Log in to public ECR
      id: ecr-login
      if: ${{ inputs.ecr-login == 'true' }}
      shell: bash
      env:
        AWS_ASSUME_OUTCOME: ${{ steps.aws.outcome }}
        AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key }}
        AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
        AWS_REGION: us-east-1
      run: |
        if [ "$AWS_ASSUME_OUTCOME" != "success" ]; then
          echo "::warning::Could not assume the public ECR role; pulling from public.ecr.aws anonymously (may be rate-limited)."
          exit 0
        fi
        if ! aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws; then
          echo "::warning::Public ECR login failed; pulling from public.ecr.aws anonymously (may be rate-limited)."
        fi

    # The rewrite is idempotent (tags are re-set and digests re-pinned on every run), so a transient
    # registry error is retried. Tracked files are restored between attempts so a partial rewrite
    # can't leak into the PR; some targets edit modules outside make_dir, so the restore is repo-wide.
    - name: Update agent version
      id: update
      shell: bash
      working-directory: ${{ inputs.make_dir }}
      env:
        INSTRUMENTATION_AGENT: ${{ inputs.instrumentation_agent }}
        AGENT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        # Both values reach make recipes unquoted, so reject anything that isn't a plain name/version.
        for value in "$INSTRUMENTATION_AGENT" "$AGENT_VERSION"; do
          if ! [[ "$value" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Invalid instrumentation_agent or version '$value' (allowed: letters, digits, '.', '_', '-')."
            exit 1
          fi
        done
        max_attempts=3
        repo_root="$(git rev-parse --show-toplevel)"
        if [ -z "$(git -C "$repo_root" status --porcelain --untracked-files=no)" ]; then
          restore_between_attempts=true
        else
          restore_between_attempts=false
          echo "::warning::Working tree has changes before the update; it won't be restored between retries."
        fi
        for attempt in $(seq 1 "$max_attempts"); do
          if make -f agent-deps.mk upgrade-agent \
            INSTRUMENTATION_AGENT="$INSTRUMENTATION_AGENT" AGENT_VERSION="$AGENT_VERSION"; then
            exit 0
          fi
          if [ "$attempt" -eq "$max_attempts" ]; then
            echo "::error::upgrade-agent failed after $max_attempts attempts."
            exit 1
          fi
          delay=$((30 * attempt))
          echo "::warning::upgrade-agent failed (attempt $attempt/$max_attempts); retrying in ${delay}s."
          if [ "$restore_between_attempts" = "true" ]; then
            git -C "$repo_root" checkout -- .
          fi
          sleep "$delay"
        done

    - name: Log out of public ECR
      if: ${{ always() && steps.ecr-login.outcome != 'skipped' }}
      shell: bash
      run: docker logout public.ecr.aws || true

    - name: Detect changes
      id: diff
      shell: bash
      env:
        INSTRUMENTATION_AGENT: ${{ inputs.instrumentation_agent }}
        AGENT_VERSION: ${{ inputs.version }}
      run: |
        if [ -z "$(git status --porcelain)" ]; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "No changes produced for $INSTRUMENTATION_AGENT -> $AGENT_VERSION (instrumentation not consumed here, or already up to date)."
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Get agent version updater token
      if: ${{ steps.diff.outputs.changed == 'true' }}
      id: agent-version-sts
      uses: odigos-io/ci-core/sts@main
      with:
        scope: ${{ github.repository }}
        identity: agent-version-updater
        output-git-config: "false"

    - name: Create pull request
      if: ${{ steps.diff.outputs.changed == 'true' }}
      id: cpr
      uses: peter-evans/create-pull-request@v8
      with:
        token: ${{ steps.agent-version-sts.outputs.GH_TOKEN }}
        branch: update-${{ inputs.instrumentation_agent }}-agents-version-${{ inputs.version }}
        title: "chore: update ${{ inputs.instrumentation_agent }} version to ${{ inputs.version }}"
        body: |
          Automated update of the **${{ inputs.instrumentation_agent }}** instrumentation agent to `${{ inputs.version }}`
          (Dockerfile image tags and/or go.mod, as applicable for this repo).

          **Triggered by:** ${{ github.event_name }}
        commit-message: "chore: update ${{ inputs.instrumentation_agent }} version to ${{ inputs.version }}"
        delete-branch: true
        sign-commits: true
        labels: |
          new-agent-version
          release-bot

    - name: Enable Pull Request Automerge
      id: automerge
      if: ${{ steps.diff.outputs.changed == 'true' && inputs.automerge == 'true' && steps.cpr.outputs.pull-request-operation == 'created' }}
      uses: peter-evans/enable-pull-request-automerge@v3
      with:
        token: ${{ steps.agent-version-sts.outputs.GH_TOKEN }}
        pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
        merge-method: squash

    # `job.status` isn't updated by failed steps inside a composite action (actions/runner#1682), so
    # the result is derived from this action's own step outcomes and passed to the notifier explicitly.
    - name: Determine result
      id: result
      if: ${{ always() }}
      shell: bash
      env:
        FAILED: ${{ steps.update.outcome != 'success' || steps.diff.outcome != 'success' || steps.agent-version-sts.outcome == 'failure' || steps.cpr.outcome == 'failure' || steps.automerge.outcome == 'failure' }}
        PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
      run: |
        if [ "$FAILED" = "true" ]; then
          echo "status=failure" >> "$GITHUB_OUTPUT"
        elif [ -n "$PR_NUMBER" ]; then
          echo "status=success" >> "$GITHUB_OUTPUT"
        fi

    - name: Notify Slack
      if: ${{ always() && (steps.result.outputs.status == 'success' || steps.result.outputs.status == 'failure') }}
      uses: odigos-io/ci-core/.github/actions/slack-release-notification@main
      with:
        webhook-url: ${{ inputs.webhook-url }}
        status: ${{ steps.result.outputs.status }}
        success-description: "Created PR to update ${{ inputs.instrumentation_agent }} version to ${{ inputs.version }}."
        failure-description: "${{ steps.automerge.outcome == 'failure' && format('ERROR: Opened {0} to update {1} version to {2}, but enabling auto-merge failed', steps.cpr.outputs.pull-request-url, inputs.instrumentation_agent, inputs.version) || format('ERROR: Failed to update {0} version to {1}', inputs.instrumentation_agent, inputs.version) }}"
        tag: ${{ inputs.version }}
        release-pr-link: ${{ steps.cpr.outputs.pull-request-url }}
