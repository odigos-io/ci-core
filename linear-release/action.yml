name: "Linear Release"
description: "Sync a released tag into a Linear release pipeline, attaching the issues that shipped in it."

# Runs AFTER the tag and the GitHub release exist. The sync walks the commits in
# `<base-ref>..HEAD`, so the calling job must be sitting on the released commit
# with history (`fetch-depth: 0`).
#
# Out of the box the CLI only recognises an issue key preceded by a magic word
# ("fixes RUN-1", "part of RUN-1") or a `(#123)` pull request reference. A key
# sitting on its own in the subject is NOT detected — hence the `issue-pattern`
# default below, which is what makes our usual `feat(x): thing (RUN-1)` link.
#
# Which Linear pipeline a release lands in is decided by the access key, not by
# anything here — a pipeline access key belongs to exactly one pipeline.
#
# Fail-soft by design: by the time this runs the release is already published,
# so a Linear outage — or a repo whose LINEAR_ACCESS_KEY is not provisioned yet
# — warns and moves on instead of turning a shipped release red. Set
# `fail-on-error: "true"` to opt out of that.
#
#   - uses: odigos-io/ci-core/linear-release@main
#     with:
#       access-key: ${{ secrets.LINEAR_ACCESS_KEY }}
#       version: ${{ needs.calculate.outputs.new_version }}
#       base-ref: ${{ needs.calculate.outputs.current_version }}

inputs:
  access-key:
    description: >
      Linear pipeline access key, normally `secrets.LINEAR_ACCESS_KEY`. An unset
      secret interpolates to an empty string rather than erroring, so an empty
      value skips the sync — the usage snippet can be adopted in a repo before
      anyone has provisioned the secret.
    required: false
    default: ""
  version:
    description: >
      The released tag, e.g. `v1.4.2`. Becomes the release title; the pill
      beside it carries the commit SHA. Two tags on one commit therefore
      resolve to the same release.
    required: true
  name:
    description: >
      Overrides the release title. Defaults to `version` (the tag), which is
      almost always what you want.
    required: false
    default: ""
  base-ref:
    description: >
      Start of the commit scan, exclusive — `<base-ref>..HEAD`. Pass the
      PREVIOUS release tag; it is dropped with a warning if it is unresolvable
      or not an ancestor of HEAD, so it is safe to pass unconditionally. Left
      empty, Linear picks the base from its own record of the last release.
    required: false
    default: ""
  include-paths:
    description: "Comma-separated globs restricting which commits count, e.g. `frontend/**,common/**`. For monorepos."
    required: false
    default: ""
  issue-pattern:
    description: >
      Regex whose FIRST capture group is a Linear issue key, matched against
      commit subjects. Without this the CLI only detects keys preceded by a
      magic word ("fixes RUN-1", "part of RUN-1"), so a bare or parenthesised
      key is invisible — which is how most of our commits are written. Left
      empty it is built from the repo-root `linear-team-keys` file, the single
      source shared with `require-linear`. Keep the key in capture group 1 if
      you override it.
    required: false
    default: ""
  links:
    description: >
      Links to attach to the release, one per line, each an absolute URL or
      `Label=URL`. Appended without de-duplication, so a re-run adds them again.
    required: false
    default: ""
  release-notes:
    description: >
      Path to a markdown file whose contents become the release notes in
      Linear. Linear only auto-generates notes from attached issues, so a
      release that matched none has nothing to show without this. A missing
      file is a warning, not an error.
    required: false
    default: ""
  dry-run:
    description: "Scan commits and read from Linear, but skip the create/update mutations."
    required: false
    default: "false"
  fail-on-error:
    description: >
      Fail the step when the sync cannot start or Linear rejects it. Default
      false — see the fail-soft note above.
    required: false
    default: "false"

outputs:
  release-id:
    description: "Linear release ID. Empty when nothing was created or updated."
    value: ${{ steps.sync.outputs.release-id }}
  release-name:
    description: "Linear release name. Empty when nothing was created or updated."
    value: ${{ steps.sync.outputs.release-name }}
  release-version:
    description: "Linear release version. Empty when nothing was created or updated."
    value: ${{ steps.sync.outputs.release-version }}
  release-url:
    description: "URL of the Linear release. Empty when nothing was created or updated."
    value: ${{ steps.sync.outputs.release-url }}

runs:
  using: composite
  steps:

    - name: Validate inputs
      id: guard
      shell: bash
      env:
        ACCESS_KEY: ${{ inputs.access-key }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        VERSION: ${{ inputs.version }}
        BASE_REF: ${{ inputs.base-ref }}
        RELEASE_NOTES: ${{ inputs.release-notes }}
        ISSUE_PATTERN: ${{ inputs.issue-pattern }}
      run: |
        set -euo pipefail

        # One source for the team keys, shared with require-linear. No hardcoded
        # fallback: a stale duplicate that disagrees with the file is the drift
        # that file exists to end. Unreadable means no custom pattern, which only
        # costs us the bare-key detection.
        if [[ -z "${ISSUE_PATTERN}" ]]; then
          KEYS=$(tr -d '[:space:]' < "${GITHUB_ACTION_PATH}/../linear-team-keys" 2>/dev/null || true)
          if [[ -n "${KEYS}" ]]; then
            ISSUE_PATTERN="\\b((?:${KEYS})-[0-9]+)"
          else
            echo "::warning::linear-release: could not read linear-team-keys; falling back to upstream's built-in issue detection."
          fi
        fi
        echo "issue-pattern=${ISSUE_PATTERN}" >> "$GITHUB_OUTPUT"

        # The caller passes the highest tag by semver, which for a minor cut from
        # the default branch lives on a release branch and is therefore not an
        # ancestor of HEAD. Scanning from it fails outright, so resolve it to the
        # fork point instead: <merge-base>..HEAD is everything this release ships
        # that the previous one did not. On a release branch the ref is already an
        # ancestor and merge-base returns it unchanged.
        if [[ -n "${BASE_REF}" ]] && ! git merge-base --is-ancestor "${BASE_REF}" HEAD 2>/dev/null; then
          FORK_POINT="$(git merge-base "${BASE_REF}" HEAD 2>/dev/null || true)"
          if [[ -n "${FORK_POINT}" ]]; then
            echo "::notice::linear-release: base-ref ${BASE_REF} is not an ancestor of HEAD; scanning from the fork point ${FORK_POINT} instead."
            BASE_REF="${FORK_POINT}"
          else
            echo "::warning::linear-release: base-ref ${BASE_REF} is unresolvable; letting Linear choose the scan baseline."
            BASE_REF=""
          fi
        fi
        echo "base-ref=${BASE_REF}" >> "$GITHUB_OUTPUT"

        # Linear renders name as the title and version as the pill beside it.
        echo "short-sha=$(git rev-parse --short HEAD 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

        # Losing the notes is not worth losing the sync over.
        if [[ -n "${RELEASE_NOTES}" && ! -f "${RELEASE_NOTES}" ]]; then
          echo "::warning::linear-release: release-notes file ${RELEASE_NOTES} does not exist; syncing without notes."
          RELEASE_NOTES=""
        fi
        echo "release-notes=${RELEASE_NOTES}" >> "$GITHUB_OUTPUT"

        if [[ -n "${ACCESS_KEY}" ]]; then
          exit 0
        fi

        MSG="linear-release: no access key, so ${VERSION:-this release} was not synced to Linear. Add the LINEAR_ACCESS_KEY secret and pass it as access-key."
        if [[ "${FAIL_ON_ERROR}" == "true" ]]; then
          echo "::error::${MSG}"
          exit 1
        fi

        echo "::warning::${MSG}"
        echo "skip=true" >> "$GITHUB_OUTPUT"

    - name: Sync release to Linear
      id: sync
      if: steps.guard.outputs.skip != 'true'
      # A literal `true`, deliberately, and not `${{ inputs.fail-on-error != 'true' }}`:
      # the runner evaluates this key only after the wrapped action has run, by
      # which point it has swapped the `inputs` context for the WRAPPED action's
      # inputs — so any expression reading ours silently evaluates to null and the
      # flag would be a no-op. Whether a failure is fatal is decided one step down.
      continue-on-error: true
      uses: linear/linear-release-action@17b8c24f8ceb2b98cabaf1965ff83c55dd596fac # v0.15.1
      with:
        access_key: ${{ inputs.access-key }}
        command: sync
        name: ${{ inputs.name != '' && inputs.name || inputs.version }}
        version: ${{ steps.guard.outputs.short-sha != '' && steps.guard.outputs.short-sha || inputs.version }}
        base_ref: ${{ steps.guard.outputs.base-ref }}
        include_paths: ${{ inputs.include-paths }}
        links: ${{ inputs.links }}
        issue_pattern: ${{ steps.guard.outputs.issue-pattern }}
        release_notes: ${{ steps.guard.outputs.release-notes }}
        dry_run: ${{ inputs.dry-run }}
        # Pinned here rather than inherited: upstream's own cli_version default
        # moves with the action version, and owning that pin in one place is the
        # reason this wrapper exists.
        cli_version: v0.15.0
        log_level: ${{ runner.debug == '1' && 'verbose' || '' }}

    - name: Report the outcome
      # Skipped whenever the sync was — the guard has already had its say.
      if: always() && steps.sync.outcome != 'skipped'
      shell: bash
      env:
        OUTCOME: ${{ steps.sync.outcome }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        RELEASE_NAME: ${{ steps.sync.outputs.release-name }}
        RELEASE_URL: ${{ steps.sync.outputs.release-url }}
      run: |
        set -euo pipefail

        # `continue-on-error` above hides the red X, so this is where a failure
        # becomes visible — and, if the caller asked for it, fatal.
        if [[ "${OUTCOME}" != "success" ]]; then
          MSG="linear-release: the Linear sync failed. The tag and the GitHub release are unaffected; re-run this job or add the release in Linear by hand."
          if [[ "${FAIL_ON_ERROR}" == "true" ]]; then
            echo "::error::${MSG}"
            exit 1
          fi
          echo "::warning::${MSG}"
          exit 0
        fi

        # dry-run, and a sync that matched no issues, both return without a URL.
        if [[ -z "${RELEASE_URL}" ]]; then
          echo "linear-release: no release was created or updated."
          exit 0
        fi

        {
          echo "### Linear release"
          echo
          echo "- [${RELEASE_NAME}](${RELEASE_URL})"
        } >> "$GITHUB_STEP_SUMMARY"
