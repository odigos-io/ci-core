name: require-linear Test

# pr-policy.yml calls require-linear@main, so a change to this action is not
# exercised by the PR that makes it. This runs the PR's own copy.

on:
  pull_request:
    paths:
      - 'require-linear/**'
      - 'linear-team-keys'
      - '.github/workflows/test-require-linear.yml'
  workflow_dispatch:

permissions: read-all

jobs:
  decision-table:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --test require-linear/test.js

  # TEMPORARY: proves that consuming the action from a subdirectory downloads the
  # whole repo, so check.js can read ../linear-team-keys. `uses:` takes no
  # expressions, hence the hardcoded branch.
  remote-consumption:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: odigos-io/ci-core/require-linear@run-1088-require-linear-commit
